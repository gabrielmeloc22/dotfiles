## unbinds
unbind r
unbind C-b
unbind '"'
unbind %
unbind x
unbind h
unbind -T copy-mode-vi Enter

# sets
set -g prefix C-s

set-window-option -g mode-keys vi
set-option -g status-position top
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 0

## i'm weak
set -g mouse on

set-option -g status-position top
 set-option -g renumber-windows on

## bindings
bind r source-file ~/.config/tmux/tmux.conf

bind C-s send-prefix

bind r source-file ~/.config/tmux/tmux.conf

bind-key x kill-pane

bind-key s split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key -r o last-window
bind-key -r l next-window
bind-key -r h previous-window

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "reattach-to-user-namespace pbcopy"

## plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin '2kabhishek/tmux2k' # theme
set -g @tmux2k-theme 'duo'
#
# # to show icons only
set -g @tmux2k-icons-only true
#
# # to customize duo bg and fg
set -g @tmux2k-duo-fg "default" # this will get you duo blue shown above
set -g @tmux2k-duo-bg "default" # this will set the bg for duo theme

# to not show powerline
set -g @tmux2k-show-powerline false
set -g @tmux2k-show-flags true

# set the left and right plugin sections
set -g @tmux2k-left-plugins "session"
set -g @tmux2k-right-plugins "network cpu ram battery time"
set -g @tmux2k-window-list-alignment "left"

set -g @tmux2k-military-time true

# omg we're back again
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.config/.tmux/plugins/tpm/tpm'

